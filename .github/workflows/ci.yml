name: CI

on:
  push:
    branches: [ master, main ]
  # Step PRs merge into a week branch first (week4-partA, week4/partB, week5-testing, ...), so they are checked on
  # Linux before the week reaches master. A '*' never matches '/', so the naming styles need one pattern each.
  # 'main' is listed next to 'master' so that CI keeps running if the default branch is renamed to main.
  pull_request:
    branches: [ master, main, 'week4-part*', 'week4/part*', 'week5-*' ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ApexPost.slnx

      # Warnings fail the build: the brief requires a zero-warning build.
      - name: Build
        run: dotnet build ApexPost.slnx --no-restore --configuration Release -warnaserror

      # Every change to the EF Core model must come with a migration. This needs no database: the design-time
      # factory falls back to an offline connection string when no secret is set.
      - name: Check for model changes without a migration
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/ApexPost.Infrastructure --no-build --configuration Release

      # The test pyramid runs level by level (TESTING-STRATEGY.md §3), so a red run says which level failed. Unit tests
      # run before SQL Server starts: they need no database, no files and no network.
      - name: Unit tests
        run: dotnet test tests/ApexPost.UnitTests --no-build --configuration Release --logger trx --results-directory TestResults

      # Integration tests create and drop their own databases on a real SQL Server. The container is thrown away
      # with the runner and gets a random password per run, so no credential is stored in the repository.
      - name: Start SQL Server
        run: |
          SA_PASSWORD="Ci-$(openssl rand -hex 16)!"
          echo "::add-mask::$SA_PASSWORD"
          docker run -d --name mssql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SA_PASSWORD" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for attempt in $(seq 1 60); do
            docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -Q "SELECT 1" > /dev/null 2>&1 && break
            sleep 2
          done
          echo "APEXPOST_TEST_SQLSERVER=Server=localhost,1433;User ID=sa;Password=$SA_PASSWORD;TrustServerCertificate=True" >> "$GITHUB_ENV"

      # One project per real dependency: SQL Server (Infrastructure), the API host, the Web host, Couchbase Lite (the
      # courier store) and the courier app's composition. All of them run, and the step fails if any failed.
      - name: Integration tests
        run: |
          failed=0
          for project in tests/*.IntegrationTests; do
            dotnet test "$project" --no-build --configuration Release --logger trx --results-directory TestResults || failed=1
          done
          exit $failed

      # The top of the pyramid: business scenarios in Gherkin (Reqnroll). Head office runs in memory over its own
      # throwaway database on the same SQL Server; the courier's device uses Couchbase Lite in a temporary folder.
      - name: Acceptance scenarios (Reqnroll)
        run: dotnet test tests/ApexPost.Specs --no-build --configuration Release --logger trx --results-directory TestResults

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

      # The 400/500 decision reads stack traces, and a running server inlines hot business code into its callers.
      # Tests normally run on unoptimized first-call code, so run the error-handling tests again fully optimized
      # (ADR 0018).
      - name: Test error handling with full JIT optimization
        env:
          DOTNET_TieredCompilation: 0
        run: >-
          dotnet test tests/ApexPost.Web.IntegrationTests --no-build --configuration Release
          --filter "FullyQualifiedName~ProblemDetailsMappingTests|FullyQualifiedName~AuthenticationTests"
