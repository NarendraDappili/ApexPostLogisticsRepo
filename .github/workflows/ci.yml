name: CI

on:
  push:
    branches: [ master ]
  # Week 4 step PRs merge into a part branch first (week4-partA, ...), so they are checked on Linux before the part
  # reaches master.
  pull_request:
    branches: [ master, 'week4-part*' ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ApexPost.slnx

      # Warnings fail the build: the brief requires a zero-warning build.
      - name: Build
        run: dotnet build ApexPost.slnx --no-restore --configuration Release -warnaserror

      # Every change to the EF Core model must come with a migration. This needs no database: the design-time
      # factory falls back to an offline connection string when no secret is set.
      - name: Check for model changes without a migration
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/ApexPost.Infrastructure --no-build --configuration Release

      # Integration tests create and drop their own databases on a real SQL Server. The container is thrown away
      # with the runner and gets a random password per run, so no credential is stored in the repository.
      - name: Start SQL Server
        run: |
          SA_PASSWORD="Ci-$(openssl rand -hex 16)!"
          echo "::add-mask::$SA_PASSWORD"
          docker run -d --name mssql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SA_PASSWORD" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for attempt in $(seq 1 60); do
            docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -Q "SELECT 1" > /dev/null 2>&1 && break
            sleep 2
          done
          echo "APEXPOST_TEST_SQLSERVER=Server=localhost,1433;User ID=sa;Password=$SA_PASSWORD;TrustServerCertificate=True" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test ApexPost.slnx --no-build --configuration Release --verbosity normal

      # The 400/500 decision reads stack traces, and a running server inlines hot business code into its callers.
      # Tests normally run on unoptimized first-call code, so run the error-handling tests again fully optimized
      # (ADR 0018).
      - name: Test error handling with full JIT optimization
        env:
          DOTNET_TieredCompilation: 0
        run: >-
          dotnet test tests/ApexPost.Web.IntegrationTests --no-build --configuration Release
          --filter "FullyQualifiedName~ProblemDetailsMappingTests|FullyQualifiedName~AuthenticationTests"
